<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">RUpload — Roblox bulk publishing</title>
  <desc id="description">A small tool for batch publishing Roblox assets, products and passes.</desc>
  <rect width="1200" height="630" fill="#17211d"/>
  <path d="M0 470C210 385 326 553 535 479s337-139 665-21v172H0Z" fill="#24372d"/>
  <circle cx="1000" cy="91" r="190" fill="#30483a" opacity=".55"/>
  <rect x="86" y="78" width="68" height="68" rx="18" fill="#d8e6d2"/>
  <path d="M101 113h38m-19-19v38" stroke="#24372d" stroke-width="5" stroke-linecap="round"/>
  <text x="178" y="130" fill="#f1f2e9" font-family="Arial,sans-serif" font-size="44" font-weight="700">RUpload</text>
  <text x="90" y="253" fill="#f1f2e9" font-family="Georgia,serif" font-size="72">Less repeat work.</text>
  <text x="90" y="331" fill="#bfcfbd" font-family="Georgia,serif" font-size="72">More time to build.</text>
  <text x="92" y="391" fill="#c5cec2" font-family="Arial,sans-serif" font-size="25">Batch publish Roblox assets, developer products and game passes.</text>
  <g font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <rect x="90" y="462" width="250" height="78" rx="16" fill="#e6eee1"/><text x="215" y="510" fill="#26372e">Assets</text>
    <rect x="370" y="462" width="290" height="78" rx="16" fill="#d8e2d3"/><text x="515" y="510" fill="#26372e">Developer products</text>
    <rect x="690" y="462" width="230" height="78" rx="16" fill="#c9d8c7"/><text x="805" y="510" fill="#26372e">Game passes</text>
  </g>
  <text x="92" y="590" fill="#a8b6a8" font-family="Arial,sans-serif" font-size="16">Independent community tool · not affiliated with Roblox</text>
</svg>
